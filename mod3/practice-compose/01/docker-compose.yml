name: practica-01

services:
  web: 
    image: nginx:1.27-alpine
    ports: 
      - "8080:80"
      - 3000:3000
    networks:
      - frontend
    
  api:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    networks:
      - frontend
      - backend
  
  db:
    image: postgres-16-alpine
    environment:
      - POSTGRES_PASSWORD: dev-only
    volumes:
      - pgdata: # ruta de volume
    networks:
      - backend

networks: 
  frontend:
  backend:


