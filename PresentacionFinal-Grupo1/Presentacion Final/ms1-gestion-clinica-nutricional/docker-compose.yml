services:
  gestion-clinica-api:
    image: logfile1995/gestionclinicanutricional:latest
#    build:
#      context: .
#      dockerfile: Dockerfile
    container_name: gestion-clinica-nutricional
    ports:
      - "3001:80"
    environment:
      - ASPNETCORE_URLS=http://*:80
    networks: [backend]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/swagger/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  backend:
